name: Ingest articles

on:
  schedule:
    # Every 6 hours, off the hour: GitHub delays and sometimes drops scheduled runs that start on the hour.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Two runs writing the same file would race: queue the second one instead of cancelling either.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run pipeline

      # Gate: an archive the app cannot trust is never committed.
      - run: npx vitest run test/unit/articles-data.test.ts

      - name: Commit the archive if it changed
        run: |
          if git diff --quiet -- data/articles.json; then
            echo "No new or expired articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "chore(data): update articles"
          git push
